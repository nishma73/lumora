<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="LUMORA — a modern lifestyle and technology product store."
    >

    <title>LUMORA — Modern Essentials</title>
    <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23928E5E'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%23DDD3C9' font-family='Arial'%3EL%3C/text%3E%3C/svg%3E"
>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="site-header">

        <nav class="navbar" aria-label="Main navigation">

            <a href="#/" class="logo">
                LUMORA<span>.</span>
            </a>

            <div class="nav-links">

                <a href="#/" data-route>Home</a>

                <a href="#/shop" data-route>Shop</a>

                <a href="#/about" data-route>About</a>

                <a href="#/contact" data-route>Contact</a>

            </div>

            <div class="nav-actions">

                <button
                    id="themeToggle"
                    class="icon-button"
                    aria-label="Toggle theme"
                    type="button"
                >
                    ☼
                </button>

                <button
                    id="cartButton"
                    class="cart-button"
                    type="button"
                    aria-label="Open shopping cart"
                >
                    Bag
                    <span id="cartCount">0</span>
                </button>

            </div>

        </nav>

    </header>


    <!-- Main Application -->
    <main id="app" tabindex="-1"></main>


    <!-- Cart Drawer -->
    <aside
        id="cartDrawer"
        class="cart-drawer"
        aria-label="Shopping cart"
        aria-hidden="true"
    >

        <div class="cart-header">

            <div>
                <p class="eyebrow">YOUR BAG</p>
                <h2>Your selections</h2>
            </div>

            <button
                id="closeCart"
                class="close-button"
                type="button"
                aria-label="Close cart"
            >
                ×
            </button>

        </div>


        <div id="cartItems" class="cart-items"></div>


        <div class="cart-footer">

            <div class="cart-total">
                <span>Total</span>
                <strong id="cartTotal">₹0</strong>
            </div>

            <button
                id="checkoutButton"
                class="primary-button full-width"
                type="button"
            >
                Proceed to Checkout
            </button>

        </div>

    </aside>


    <!-- Overlay -->
    <div id="overlay" class="overlay"></div>


    <!-- Toast -->
    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>


    <script src="js/products.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
